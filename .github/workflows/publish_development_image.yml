name: Build development container image

on:
  workflow_dispatch:

concurrency:
  group: development-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build_push_development:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE: ghcr.io/scilifelabdatacentre/precision-medicine-portal:dev-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A literal development tag keeps this workflow separate from the
      # semver/latest aliases generated by the release publisher.
      - name: Build and push development image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: true
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=precision-medicine-portal
            org.opencontainers.image.description=Development build of the precision medicine portal
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=dev-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Scan the published development image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/scilifelabdatacentre/precision-medicine-portal@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-development-image-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true

      - name: Upload development image scan
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-development-image-results.sarif
          category: trivy-development-image

      - name: Write deployment details
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Development image ready

          Image: \`$IMAGE\`

          Argo CD development image tag: \`dev-$GITHUB_SHA\`

          Immutable image: \`ghcr.io/scilifelabdatacentre/precision-medicine-portal@$DIGEST\`

          Commit the image tag or digest to the development deployment configuration in the Argo CD repository, then sync the development application.
          EOF
