# App CI: install, lint, typecheck and unit-test, then production-build the
# Next.js app, boot the standalone server output (what the Docker image ships)
# and smoke test key routes. Nothing else in CI compiles the app, so this is
# the gate that catches unbuildable dependency updates.
---
name: App CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, test, build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (version from next-app/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: next-app/.nvmrc
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        working-directory: ./next-app
        run: npm ci

      - name: Lint
        working-directory: ./next-app
        run: npm run lint

      - name: Typecheck
        working-directory: ./next-app
        run: npm run typecheck

      - name: Test
        working-directory: ./next-app
        run: npm test

      - name: Build (production)
        working-directory: ./next-app
        run: npm run build

      # Mirrors the Dockerfile's runner stage. /data-sources renders
      # through security-utils -> isomorphic-dompurify -> jsdom on the
      # server, so this also guards the documented ERR_REQUIRE_ESM risk
      # of isomorphic-dompurify v3+ in bundled CommonJS environments.
      - name: Smoke test standalone server
        working-directory: ./next-app
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && PORT=3000 HOSTNAME=127.0.0.1 node server.js &)
          npx wait-on -t 60000 http://127.0.0.1:3000
          for path in / /data-sources /contact /omop-cdm /about/team; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Verify production release excludes NGP
        if: startsWith(github.ref, 'refs/heads/release/')
        working-directory: ./next-app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const config = JSON.parse(readFileSync('../.github/pa11y.config', 'utf8'));
          const urls = config.urls.map(entry => typeof entry === 'string' ? entry : entry.url);
          urls.push('http://127.0.0.1:3000/sitemap.xml');
          for (const url of urls) {
            const response = await fetch(url);
            assert.equal(response.status, 200, url);
            assert.doesNotMatch(await response.text(), /national.genomics|\bNGP\b/i, url);
          }
          for (const suffix of ['', '/']) {
            const url = `http://127.0.0.1:3000/data-sources/national-genomics-platform${suffix}`;
            assert.equal((await fetch(url)).status, 404, url);
          }
          const manifest = readFileSync('.next/server/app-paths-manifest.json', 'utf8');
          assert.doesNotMatch(manifest, /national-genomics-platform/i);
          console.log(`Verified ${urls.length} public responses, NGP 404s and build manifest`);
          NODE
